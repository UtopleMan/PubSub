services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pulse-sample-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (optional; the console does not use it)
